{% extends 'base.html' %}

{% block title %}Xác Nhận Xóa Tin Tuyển Dụng - AI Recruiter Portal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 py-16">
    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-xl text-center">
        <div class="w-14 h-14 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto mb-4">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </div>

        <h2 class="text-xl font-bold text-slate-900 mb-2">Xác nhận xóa bài tuyển dụng?</h2>
        <p class="text-xs text-slate-500 mb-6">
            Bạn có chắc chắn muốn xóa vĩnh viễn vị trí: <br>
            <strong class="text-slate-900 font-semibold">"{{ job.title }}"</strong>?
            Hành động này không thể hoàn tác.
        </p>

        <form method="POST" class="flex items-center justify-center space-x-3">
            {% csrf_token %}
            <a href="{% url 'jobs:hr_dashboard' %}" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 text-xs font-semibold transition">
                Hủy bỏ
            </a>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold shadow-md shadow-rose-200 transition">
                Xóa bài đăng
            </button>
        </form>
    </div>
</div>
{% endblock %}
